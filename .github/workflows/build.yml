name: Build APK
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HTML-Runner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: HTML Runner build #${{ github.run_number }}
          body: |
            Automatically generated Android APK.
            Download app-debug.apk below and install it on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$current_tag" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
