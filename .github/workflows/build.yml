name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HTML-Runner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: HTML Runner build #${{ github.run_number }}
          body: |
            Automatically generated Android APK.
            Download app-debug.apk below and install it on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
